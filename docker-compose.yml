version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ./Design a Form
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./Design a Form:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - brightmind-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./educational-kb:/educational-kb
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./brightmind.db
      - SECRET_KEY=your-secret-key-change-in-production
      - ENVIRONMENT=development
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - brightmind-network

  # Ollama (Gemma 4 Runtime)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - brightmind-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # For CPU-only, remove the deploy section above

volumes:
  ollama_data:

networks:
  brightmind-network:
    driver: bridge
