services:
  - type: web
    name: brightmind
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd "Design a Form" && npm install && npm run build
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.0.0
